spring:
  datasource:
    # Local-verification stand-in only: H2 in PostgreSQL-compatibility mode,
    # because this environment has no Docker/Postgres. CI validates
    # migrations against a real PostgreSQL service container instead.
    url: jdbc:h2:mem:destinyos_app;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
