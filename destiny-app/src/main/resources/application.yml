# Render (and most PaaS hosts) assign the listen port at runtime via $PORT;
# 8080 is the fallback for local runs and plain `docker run` without it set.
server:
  port: ${PORT:8080}

spring:
  application:
    name: destiny-os
  threads:
    virtual:
      enabled: true
  # Real database (e.g. Supabase Postgres). Values come from environment
  # variables - loaded from a local, gitignored .env at the repo root via
  # spring-dotenv, never hardcoded here (Master Spec §28). The "test" profile
  # (application-test.yml) overrides all of this with an in-memory H2 stand-in.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    # Comma-separated list. Defaults to the local Next.js dev server only;
    # add the deployed frontend's real origin (e.g. a Vercel URL) here via
    # the APP_CORS_ALLOWED_ORIGINS env var once it exists — see WebCorsConfig.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

destiny:
  execution:
    default-timeout: 5s
    max-concurrency: 16
  # Retention (CLAUDE.md section 7, DATA_MODEL_AND_RETENTION.md sections 8 and 11).
  # Disabled by default: a scheduled job that deletes rows must be switched on
  # deliberately by whoever runs the system, not arrive switched on. Durations
  # default to the conservative end of the spec's ranges (30 days for daily
  # readings out of 7-30, 90 for other transient runs out of 30-90) - keeping
  # too long is the recoverable mistake.
  retention:
    enabled: ${DESTINY_RETENTION_ENABLED:false}
    daily-duration: ${DESTINY_RETENTION_DAILY:30d}
    transient-duration: ${DESTINY_RETENTION_TRANSIENT:90d}
    batch-size: ${DESTINY_RETENTION_BATCH_SIZE:500}
    cron: ${DESTINY_RETENTION_CRON:0 30 3 * * *}

  # AI is optional by architecture (ADR D8). Disabled by default so the
  # hard-data path is what runs unless someone deliberately turns narration on.
  # Setting enabled=true with no api-key/model configured still falls back
  # safely (NarrativeService requires both, not just the flag) - see
  # OpenRouterConfiguredCondition.
  ai:
    enabled: ${DESTINY_AI_ENABLED:false}
    openrouter:
      api-key: ${OPENROUTER_API_KEY:}
      # No default model (AI_NARRATIVE_SPEC.md section 7, OpenRouterProperties
      # javadoc): the free-tier catalogue changes over time, so an operator
      # who wants OpenRouter must name a model they have confirmed available.
      model: ${DESTINY_AI_OPENROUTER_MODEL:}
      # Tried in order when the model above cannot answer. Comma-separated.
      #
      # A single free model is unreliable by nature, not by bad choice: free
      # models are rate-limited UPSTREAM at the inference provider and shared
      # by every OpenRouter user. Measured live, three free models returned
      # 429 "temporarily rate-limited upstream" while two others returned 200
      # at the same instant.
      #
      # Default is the openrouter/free meta-model, which routes to whichever
      # free model is currently serving (verified working). NOT
      # openrouter/auto: that is a paid router and answers 402 Insufficient
      # credits on a free-tier account.
      #
      # This is walked client-side rather than via OpenRouter's own
      # "models": [...] request array on purpose - that array covers runtime
      # failures, but a removed or misspelled model id is rejected upfront
      # with 400 for the WHOLE request even when a valid fallback is listed
      # beside it, which is exactly the case an operator needs covered.
      fallback-models: ${DESTINY_AI_OPENROUTER_FALLBACK_MODELS:openrouter/free}
      base-url: ${DESTINY_AI_OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      # Hạn chờ của MỘT lần gọi HTTP, không phải của cả chuỗi model.
      timeout-ms: ${DESTINY_AI_OPENROUTER_TIMEOUT_MS:15000}
      # Deadline TỔNG cho một lần sinh diễn giải, tính cả mọi model trong
      # chuỗi và mọi lần retry.
      #
      # timeout-ms ở trên chỉ chặn một lần gọi HTTP, nên trước khi có tham số
      # này worst case là phép nhân của ba con số không ai nhìn cùng nhau:
      # MAX_ATTEMPTS (2) x số model x timeout-ms. Với 4 model ở 25s - đúng cấu
      # hình dự án này từng dùng - là 2 x 4 x 25000 = 200 giây cho một request.
      # Không caller nào ở dưới chờ nổi 200 giây, nên bản fallback tất định mà
      # ADR D8 bảo đảm vẫn được tạo ra nhưng không còn ai nghe.
      #
      # 45s để cả chuỗi nằm gọn dưới hạn chờ của destiny-web (75s cho lệnh
      # gọi narrative, 90s cho route kết quả). Deadline chỉ được kiểm tra
      # GIỮA các lần gọi, nên worst case thật là total-deadline-ms +
      # timeout-ms; chọn hai con số cùng nhau, đừng chọn riêng.
      total-deadline-ms: ${DESTINY_AI_OPENROUTER_TOTAL_DEADLINE_MS:45000}
      # 2000, raised from 800 after measurement - do not lower without
      # repeating it. Vietnamese is far more token-hungry than English on
      # these tokenizers and the response schema is a summary plus four
      # arrays of sentences: at 800, 2 of 3 runs against real free models
      # came back truncated mid-string (one measured at 973 chars, no
      # closing brace), so the schema check rejected them and every such
      # call degraded to the deterministic fallback. Because ADR D8 always
      # returns something renderable, that shows up as "AI is enabled and
      # never seems to do anything", not as an error. See
      # OpenRouterProperties#maxTokens.
      max-tokens: ${DESTINY_AI_OPENROUTER_MAX_TOKENS:2000}
      temperature: ${DESTINY_AI_OPENROUTER_TEMPERATURE:0.3}

# Phase 14 observability. The exposure list is pinned explicitly rather than
# left to Spring Boot's defaults, because the defaults are a moving target
# across versions and the cost of a surprise here is a leaked secret: /env and
# /configprops would render OPENROUTER_API_KEY and the datasource password
# (Master Spec section 28 forbids exposing either). health/info/metrics carry
# no credentials. ActuatorExposureTest asserts the dangerous ones stay 404.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
        exclude: env,configprops,beans,heapdump,threaddump,loggers
  endpoint:
    health:
      # Component details can name internal hosts and driver versions. The
      # liveness answer is the part a load balancer needs.
      show-details: never
  info:
    env:
      enabled: false

logging:
  level:
    io.destinyos: INFO
