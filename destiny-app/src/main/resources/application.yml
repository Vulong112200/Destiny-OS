spring:
  application:
    name: destiny-os
  threads:
    virtual:
      enabled: true
  # Real database (e.g. Supabase Postgres). Values come from environment
  # variables - loaded from a local, gitignored .env at the repo root via
  # spring-dotenv, never hardcoded here (Master Spec §28). The "test" profile
  # (application-test.yml) overrides all of this with an in-memory H2 stand-in.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

destiny:
  execution:
    default-timeout: 5s
    max-concurrency: 16
  # AI is optional by architecture (ADR D8). Disabled by default so the
  # hard-data path is what runs unless someone deliberately turns narration on.
  # Setting enabled=true with no api-key/model configured still falls back
  # safely (NarrativeService requires both, not just the flag) - see
  # OpenRouterConfiguredCondition.
  ai:
    enabled: ${DESTINY_AI_ENABLED:false}
    openrouter:
      api-key: ${OPENROUTER_API_KEY:}
      # No default model (AI_NARRATIVE_SPEC.md section 7, OpenRouterProperties
      # javadoc): the free-tier catalogue changes over time, so an operator
      # who wants OpenRouter must name a model they have confirmed available.
      model: ${DESTINY_AI_OPENROUTER_MODEL:}
      base-url: ${DESTINY_AI_OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      timeout-ms: ${DESTINY_AI_OPENROUTER_TIMEOUT_MS:15000}
      max-tokens: ${DESTINY_AI_OPENROUTER_MAX_TOKENS:800}
      temperature: ${DESTINY_AI_OPENROUTER_TEMPERATURE:0.3}

logging:
  level:
    io.destinyos: INFO
