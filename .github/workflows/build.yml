name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Runs unit, architecture and label-coverage tests.
      # The architecture suite is the gate that keeps ADR D5 and D6 true:
      # a violation fails the build rather than surviving review.
      - name: Build and test
        run: mvn -B verify
