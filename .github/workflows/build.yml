name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Runs unit, architecture, label-coverage and persistence tests. The
      # persistence tests here use H2 in PostgreSQL-compatibility mode (see
      # destiny-persistence/pom.xml) because that is what runs locally too -
      # this job is the fast default path.
      #
      # The architecture suite is the gate that keeps ADR D5 and D6 true:
      # a violation fails the build rather than surviving review.
      - name: Build and test (H2 compatibility mode)
        run: mvn -B verify

  postgres-verify:
    runs-on: ubuntu-latest
    # Closes a real gap: local development here has neither Docker nor a
    # PostgreSQL instance (see destiny-persistence/pom.xml), so Flyway
    # migrations and JPA entity mappings are verified locally against H2's
    # PostgreSQL-compatibility mode only. H2 does not enforce every
    # PostgreSQL-specific constraint. This job re-runs the exact same
    # persistence tests against a genuine PostgreSQL service container, so
    # migrations are validated against the real production target before
    # merge, not just a compatible stand-in.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: destinyos
          POSTGRES_USER: destinyos
          POSTGRES_PASSWORD: destinyos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Test destiny-persistence against real PostgreSQL
        run: >
          mvn -B -pl destiny-persistence -am test
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/destinyos
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
          -Dspring.datasource.username=destinyos
          -Dspring.datasource.password=destinyos

  # destiny-web is a separate npm project, deliberately outside the Maven
  # reactor (see its own module Javadoc / README "Build" section) - so it
  # needs its own job rather than a Maven step. Until this job existed, the
  # frontend had NO CI coverage at all despite the README calling the system
  # an end-to-end MVP with a real UI: a TypeScript error or a broken build
  # could merge to main and nobody would know until someone ran it by hand.
  web-verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: destiny-web/package-lock.json

      - name: Install dependencies
        working-directory: destiny-web
        run: npm ci

      - name: Typecheck
        working-directory: destiny-web
        run: npm run typecheck

      - name: Lint
        working-directory: destiny-web
        run: npm run lint

      # Exercises the real Next.js production build, including the type
      # checking and static-page generation next build performs on top of
      # tsc - the same three checks a contributor runs locally before this
      # workflow existed to catch a regression for them.
      - name: Build
        working-directory: destiny-web
        run: npm run build

